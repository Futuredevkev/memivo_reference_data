name: SSOT gates

# Los consumidores disparan esta auditoria aunque falle su calidad local.
# Los repos son privados: sin MEMIVO_REPOS_TOKEN se falla, no se audita un
# corpus vacio. El layout y la alineacion viven en checkout-workspace.
on:
  pull_request:
  push:
    branches: [main, 'v*', 'resolucion-*']
  workflow_dispatch:
    inputs:
      audit_ref:
        description: 'Branch del repo consumidor que disparó este gate.'
        required: false
        type: string

permissions:
  contents: read

jobs:
  ssot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: memivo-reference-data
    steps:
      - uses: Futuredevkev/memivo_reference_data/.github/actions/checkout-workspace@v1.158.25
        with:
          token: ${{ secrets.MEMIVO_REPOS_TOKEN }}
          candidate: ${{ inputs.audit_ref || github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: memivo-reference-data/.node-version
      - name: Install
        run: npm ci

      # Se ejecutan en serie. El gate deriva del package.json la lista de
      # auditores exigidos; installed-version necesita node_modules de los
      # consumidores, que este job no instala.
      - name: audit:consumers
        run: npm run audit:consumers
      - name: audit:transport
        run: npm run audit:transport
      - name: audit:response-fields
        run: npm run audit:response-fields
      - name: audit:endpoints
        run: npm run audit:endpoints
      - name: audit:route-parity
        run: npm run audit:route-parity
      - name: audit:shared-tooling
        run: npm run audit:shared-tooling
      - name: test
        run: npm test
