name: Memivo SSOT dispatch
description: Dispara y espera la corrida exacta de SSOT, sin buscarla por fecha.

inputs:
  token:
    description: Credencial de CI con actions write sobre contratos.
    required: true
  audit-ref:
    description: Rama de consumidores que debe auditarse.
    required: true

runs:
  using: composite
  steps:
    # setup-node resuelve node-version-file desde el workspace, incluso si
    # recibe una ruta absoluta. Leer la fuente de la accion, no copiarla.
    - name: Leer la version de Node del dueño
      id: runtime
      shell: bash
      run: |
        set -euo pipefail
        version="$(tr -d '\r\n' < "$GITHUB_ACTION_PATH/../../../.node-version")"
        [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
        printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ steps.runtime.outputs.version }}
    - name: Disparar y esperar SSOT
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        AUDIT_REF: ${{ inputs.audit-ref }}
        WORKFLOW_REF: ${{ github.action_ref }}
      run: node "$GITHUB_ACTION_PATH/dispatch.cjs"
